<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      /* the specifity of this selector is 1*/
          h1{
            color:aqua;
          }
          /* the specifity of this selector is 1+10=11 */
          h1.yellow{
                color: yellow;
                color:rgb(13, 13, 228) !important;
          }
          /* the specifity of this selector is 10*/
          .cpurple{
            color:purple; 
          }
          /* the specifity of this selector is 10*/
          cred{
            color:red;
          }
         /*this is an example of attribute selector. the specifity of this selector is 10 */
          [data-x=a]{
            color:maroon;
          }
          /*this has specifity 1+10+10+10+10=41 */
          a.harryclass.rohan-class[href]:hover{
            color:red;
          }
    </style>
</head>
<body>
    <div>
        <h1 style="color:blue"  class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
    </div>
</body>
</html>
