<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Boxmodel</title>
    <style>
        .box{
            background-color: lightblue;
        }
        .box1{
            color: red;
            padding: 10px;
            margin: 35px;
            border: 2px solid black;
            height: 100px;
            box-sizing: border-box;
        }
        .box2{
            color: green;
             padding: 10px;
            margin: 25px;
            border: 2px solid black;
            height: 100px;
            box-sizing: border-box;

        }
        *{
            margin: 0;
            padding: 0;
        }

    </style>
</head>
<body>
    <div class="box box1">i am box and box 1 too.</div>
    <div class="box box2">i am box and box 2 too.</div>
</body>
</html>
